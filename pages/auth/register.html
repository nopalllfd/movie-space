<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="../../scripts/auth/register.js" defer></script>
</head>

<body>
    <header
        class="sticky top-0 z-50 flex justify-between items-center gap-4 px-20 max-sm:px-4 py-4 md:px-10 lg:px-20 bg-gray-950 border-b-2 border-emerald-600 relative">
        <section class="icon flex items-center gap-2">
            <img src="../../assets/icon.svg" alt="moviespace icon">
            <p class="text-sm font-semibold pbe-1 text-emerald-400">MOVIESPACE</p>
        </section>
        <section class="buttons flex gap-8 items-center text-white max-sm:hidden">
            <a href="../../index.html"><button class="btn text-sm">ALL FILMS</button></a>
            <a href="./login.html"><button
                    class="btn bg-emerald-500 text-gray-950 rounded px-3 py-1 text-sm font-semibold">LOGIN</button></a>
        </section>
        <section class="sm:hidden">
            <details class="relative">
                <summary
                    class="cursor-pointer list-none inline-flex items-center justify-center p-2 rounded-md border border-emerald-600 text-emerald-400 transition-colors duration-150 hover:bg-emerald-500/10 hover:border-emerald-400 active:bg-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </summary>
                <nav
                    class="absolute right-0 mt-2 w-56 bg-gray-950 border-b-2 border-emerald-600 shadow-lg rounded-lg overflow-hidden text-white">
                    <a href="../../index.html"
                        class="block px-4 py-3 text-sm hover:bg-emerald-500/10 hover:text-emerald-200">ALL
                        FILMS</a>
                    <a href="./login.html"
                        class="block px-4 py-3 text-sm hover:bg-emerald-500/10 hover:text-emerald-200">LOGIN</a>
                    <a href="./register.html"
                        class="block px-4 py-3 text-sm text-emerald-400 hover:bg-emerald-500/10 hover:text-emerald-200">REGISTER</a>
                </nav>
            </details>
        </section>
    </header>
    <main class="bg-gray-900 flex justify-center items-center h-[calc(100vh-62px)] w-full max-sm:px-4">
        <form action="" class="flex flex-col gap-12 items-center w-1/3 max-sm:w-full max-sm:max-w-md relative">
            <section class="icon flex items-center gap-2">
                <img src="../../assets/icon.svg" alt="moviespace icon">
                <p class="text-sm font-semibold pbe-1 text-emerald-400">MOVIESPACE</p>
            </section>
            <section class="alert bg-red-500 text-white rounded p-1 text-xs invisible absolute top-8">
            </section>
            <section class="flex flex-col input-group text-white gap-12 w-3/4 max-sm:w-full items-center">
                <div class="email-input flex flex-col w-full relative">
                    <input class="border-b border-gray-500 outline-none py-1 text-white focus:border-emerald-400 "
                        type="email" id="email" placeholder="Email">
                    <section id="email-alert" class="text-red-500 rounded text-xs invisible absolute top-10">
                    </section>
                </div>
                <div class="password-input flex flex-col w-full relative">
                    <input class="border-b border-gray-500 outline-none py-1 text-white focus:border-emerald-400"
                        type="password" id="password" placeholder="Password">
                    <section id="password-alert" class="text-red-500 rounded text-xs invisible absolute top-10">
                    </section>
                </div>
                <div class="password-confirm-input flex flex-col w-full relative">
                    <input class="border-b border-gray-500 outline-none py-1 text-white focus:border-emerald-400"
                        type="password" id="password-confirm" placeholder="Confirm Password">
                    <section id="password-confirm-alert" class="text-red-500 rounded text-xs invisible absolute top-10">
                    </section>
                </div>

                <div class="submit-button">
                    <button type="submit"
                        class="btn bg-emerald-500 px-6 py-2 rounded text-gray-950 font-semibold">Register</button>
                </div>
            </section>
            <div class="additional-links text-emerald-400">REGISTERED USER? <a class="underline"
                    href="./login.html">LOGIN HERE</a>
            </div>
        </form>
    </main>

</body>

</html>
