<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="../../scripts/watchlist.js" defer></script>

</head>

<body>
    <header
        class="sticky top-0 z-50 flex flex-col sm:flex-row justify-between items-center gap-4 px-4 py-4 md:px-10 lg:px-20 bg-gray-950 border-b-2 border-emerald-600 relative">
        <section class="icon flex items-center gap-2">
            <img src="../../assets/icon.svg" alt="moviespace icon">
            <p class="text-sm font-semibold pbe-1 text-emerald-400">MOVIESPACE</p>
        </section>
        <section class="buttons-nav flex flex-wrap justify-center gap-4 md:gap-8 items-center text-white max-sm:hidden">
            <a href="../../index.html"><button
                    class="btn text-xs sm:text-sm cursor-pointer hover:border-b-2 transition-all duration-50 w-18 border-emerald-600">ALL
                    FILMS</button></a>
            <a href="../watchlist/index.html"><button
                    class="btn text-xs sm:text-sm cursor-pointer  hover:border-b-2 transition-all text-emerald-400  duration-50 w-26 border-emerald-600">MY
                    WATCHLIST</button></a>
            <a id="login-link" href="../auth/login.html"><button id="login-button"
                    class="btn bg-emerald-500 text-gray-950 rounded px-3 py-1 text-xs sm:text-sm font-semibold">LOGIN</button></a>
        </section>
        <section class="sm:hidden w-full flex justify-end">
            <details class="relative">
                <summary
                    class="cursor-pointer list-none inline-flex items-center justify-center p-2 rounded-md border border-emerald-600 text-emerald-400 transition-colors duration-150 hover:bg-emerald-500/10 hover:border-emerald-400 active:bg-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </summary>
                <nav
                    class="absolute right-0 mt-2 w-56 bg-gray-950 border-b-2 border-emerald-600 shadow-lg rounded-lg overflow-hidden text-white">
                    <a href="../../index.html"
                        class="block px-4 py-3 text-sm hover:bg-emerald-500/10 hover:text-emerald-200">ALL
                        FILMS</a>
                    <a href="../watchlist/index.html"
                        class="block px-4 py-3 text-sm text-emerald-400 hover:bg-emerald-500/10 hover:text-emerald-200">MY
                        WATCHLIST</a>
                    <a id="mobile-login-link" href="../auth/login.html"
                        class="block px-4 py-3 text-sm hover:bg-emerald-500/10 hover:text-emerald-200"><span
                            id="mobile-login-button">LOGIN</span></a>
                    <button id="mobile-logout-button" hidden
                        class="w-full text-left px-4 py-3 text-sm hover:bg-red-600 hover:border-red-400 active:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500/60">LOGOUT</button>
                </nav>
            </details>
        </section>
    </header>
    <main
        class="bg-gray-900 p-10 flex flex-col gap-8 px-40 max-sm:px-4 max-sm:py-8 md:px-10 lg:px-40 min-h-screen text-white justify-start items-start h-full w-full">
        <h1 class="title text-4xl font-bold max-sm:text-2xl">My Watchlist(<span class="moviesTotal"></span>)</h1>
        <div class="movies">
            <ul class="movie-list flex flex-col gap-6 ">

            </ul>
        </div>
    </main>
</body>

</html>
