<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Movies</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="scripts/main.js" defer></script>

</head>

<body>
    <header class="flex justify-between px-20 py-4 bg-gray-950 border-b-2 border-emerald-600">
        <section class="icon flex items-center gap-2">
            <img src="../../assets/icon.svg" alt="moviespace icon">
            <p class="text-sm font-semibold pbe-1 text-emerald-400">MOVIESPACE</p>
        </section>
        <section class="buttons flex gap-8 items-center text-white">
            <a href=""><button class="btn text-sm">ALL FILMS</button></a>
            <a href=""><button class="btn text-sm">MY WATCHLIST</button></a>
            <a href="./pages/auth/login.html"><button
                    class="btn bg-emerald-500 text-gray-950 rounded px-3 py-1 text-sm font-semibold">LOGIN</button></a>
        </section>
    </header>
    <main class="bg-gray-900 p-10 flex flex-col gap-8 px-40 text-white justify-start items-start h-full w-full">
        <h1 class="title text-4xl font-bold">All Films (<span class="moviesTotal"></span>)</h1>
        <div class="filter">
            <select class="text-xs border-2 rounded-full py-2 px-3 outline-none mx-2" name="" id="">
                <option value="" disabled selected>GENRE</option>
            </select>
            <select class="text-xs border-2 rounded-full py-2 px-3 outline-none ms-2" name="" id="">
                <option value="" disabled selected>SORT BY IMDB</option>
            </select>

        </div>
        <div class="movies">
            <ul class="movie-list flex flex-col gap-6 ">

            </ul>
        </div>
    </main>
</body>

</html>
